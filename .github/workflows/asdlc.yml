name: ASDLC

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 1 * *"

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install semgrep==1.136.0 setuptools==80.9.0
      - name: Expose Semgrep executable
        run: |
          scripts_dir="$(python -c 'import sysconfig; print(sysconfig.get_path("scripts"))')"
          echo "$scripts_dir" >> "$GITHUB_PATH"
          "$scripts_dir/semgrep" --version
      - run: npm ci
      - run: npm run asdlc:check

  audit:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install semgrep==1.136.0 setuptools==80.9.0
      - name: Expose Semgrep executable
        run: |
          scripts_dir="$(python -c 'import sysconfig; print(sysconfig.get_path("scripts"))')"
          echo "$scripts_dir" >> "$GITHUB_PATH"
          "$scripts_dir/semgrep" --version
      - run: npm ci
      - run: npm run asdlc:audit
      - uses: actions/upload-artifact@v4
        with:
          name: asdlc-audit-report
          path: .asdlc/reports/
