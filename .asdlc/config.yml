mode: legacy
gates:
  duplication:
    enabled: true
  boundaries:
    enabled: true
  patterns:
    enabled: true
  registry:
    enabled: true
  contracts:
    enabled: true
source_dirs:
  - apps
  - packages
min_tokens: 60
exclude:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/.next/**"
  - "**/coverage/**"
  - "**/vendor/**"
  - "**/*.min.*"
  - "**/generated/**"
  - "**/migrations/**"
  - "**/*.lock"
  - "**/package-lock.json"
  - "**/.asdlc/**"
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/__tests__/**"
  - "**/tests/**"
  - "**/test/**"
  - "**/*.stories.*"
  - "**/__mocks__/**"
  - "**/fixtures/**"
registry_path: docs/BUSINESS_RULES.md
architecture_path: docs/ARCHITECTURE.md
contracts_command: npm run test:backend
semgrep_rules_dir: .asdlc/semgrep
